<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeVoice – Caregiver Live Monitor</title>
  <style>
    :root {
      --bg: #0a0e16;
      --card-bg: #111726;
      --card-border: #1e2740;
      --text: #e8eefc;
      --muted: #8a97b4;
      --accent: #4cc9f0;
      --danger: #ff5c7a;
      --good: #3ddc97;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }
    .header-left h1 {
      font-size: 1.5rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-left p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .live-chip {
      background-color: #064e3b;
      color: var(--good);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--good);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-filter {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-filter.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: bold;
    }
    .emergency-banner {
      background: rgba(255, 92, 122, 0.15);
      border: 2px solid var(--danger);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: alertPulse 1.2s infinite alternate;
    }
    @keyframes alertPulse {
      0% { box-shadow: 0 0 10px rgba(255, 92, 122, 0.3); }
      100% { box-shadow: 0 0 25px rgba(255, 92, 122, 0.8); }
    }
    .emergency-banner.hidden { display: none; }
    .emergency-text {
      color: var(--danger);
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-ack {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      transition: transform 0.15s ease;
    }
    .msg-card.emergency-card {
      border: 2px solid var(--danger);
      background: #1c0e15;
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .msg-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.75rem;
      text-transform: uppercase;
      background: #1e293b;
      color: var(--accent);
    }
    .msg-badge.emergency {
      background: var(--danger);
      color: #fff;
    }
    .msg-body {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>👁️ EyeVoice Caregiver Station</h1>
      <p>Live mobile-ready monitor for patient messages and emergency requests</p>
    </div>
    <div class="live-chip">
      <div class="live-dot"></div>
      LIVE
    </div>
  </header>

  <!-- High-priority Emergency Banner -->
  <div id="active-emergency" class="emergency-banner hidden">
    <div class="emergency-text">
      🚨 <span id="emergency-alert-msg">EMERGENCY ASSISTANCE REQUESTED!</span>
    </div>
    <button class="btn-ack" onclick="acknowledgeEmergency()">Acknowledge</button>
  </div>

  <div class="controls">
    <button class="btn-filter active" id="filter-all" onclick="setFilter('all')">All Messages</button>
    <button class="btn-filter" id="filter-emergency" onclick="setFilter('emergency')">🚨 Emergency Only</button>
    <button class="btn-filter" onclick="fetchMessages()">🔄 Refresh</button>
  </div>

  <div class="messages-list" id="messages-container">
    <div class="empty-state">Waiting for patient messages...</div>
  </div>

  <script>
    let filter = 'all';
    let lastSeenCount = 0;
    let audioCtx = null;

    function playAlertChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {
        console.log("Audio alert not triggered:", e);
      }
    }

    function setFilter(mode) {
      filter = mode;
      document.getElementById('filter-all').classList.toggle('active', mode === 'all');
      document.getElementById('filter-emergency').classList.toggle('active', mode === 'emergency');
      renderMessages(cachedMessages);
    }

    let cachedMessages = [];

    async function fetchMessages() {
      try {
        const res = await fetch('/api/messages');
        if (!res.ok) return;
        const messages = await res.json();
        cachedMessages = messages;

        // Check if newest message is emergency and new
        if (messages.length > lastSeenCount) {
          const newest = messages[messages.length - 1];
          if (newest.emergency) {
            triggerEmergencyBanner(newest.text);
            playAlertChime();
          }
          lastSeenCount = messages.length;
        }

        renderMessages(messages);
      } catch (err) {
        console.error("Error fetching messages:", err);
      }
    }

    function triggerEmergencyBanner(msg) {
      const banner = document.getElementById('active-emergency');
      document.getElementById('emergency-alert-msg').textContent = msg;
      banner.classList.remove('hidden');
    }

    function acknowledgeEmergency() {
      document.getElementById('active-emergency').classList.add('hidden');
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      const filtered = filter === 'emergency' 
        ? messages.filter(m => m.emergency) 
        : messages;

      if (!filtered.length) {
        container.innerHTML = '<div class="empty-state">No messages logged yet.</div>';
        return;
      }

      // Display in reverse order (newest first)
      const reversed = [...filtered].reverse();
      container.innerHTML = reversed.map(m => `
        <div class="msg-card ${m.emergency ? 'emergency-card' : ''}">
          <div class="msg-header">
            <span class="msg-badge ${m.emergency ? 'emergency' : ''}">
              ${m.emergency ? '🚨 EMERGENCY' : (m.category || 'COMMUNICATION')}
            </span>
            <span class="msg-time">${m.timestamp}</span>
          </div>
          <div class="msg-body">${m.text}</div>
        </div>
      `).join('');
    }

    // Auto-poll every 2.5 seconds
    fetchMessages();
    setInterval(fetchMessages, 2500);
  </script>
</body>
</html>
